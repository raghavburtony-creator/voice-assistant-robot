name: Personal BSL research workspace

on:
  pull_request:
    paths:
      - "ml/bsl/**"
      - ".github/workflows/bsl-ml.yml"
      - "AGENTS.md"
  push:
    branches: [main]
    paths:
      - "ml/bsl/**"
      - ".github/workflows/bsl-ml.yml"
      - "AGENTS.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: ml/bsl/pyproject.toml
      - name: Install test dependencies and CPU PyTorch
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy pytest onnx onnxscript
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install --no-deps -e ./ml/bsl
      - name: Run BSL research tests
        working-directory: ml/bsl
        run: python -m pytest
