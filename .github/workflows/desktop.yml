name: Desktop

on:
  pull_request:
    paths: ['web/**', '.github/workflows/desktop.yml']
  push:
    branches: [main]
    paths: ['web/**', '.github/workflows/desktop.yml']

permissions:
  contents: read

jobs:
  web:
    name: Web checks
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: web } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: web/package-lock.json }
      - run: npm ci
      - run: npm test
      - run: npm run build

  native:
    name: Native checks (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix: { os: [ubuntu-24.04, windows-latest, macos-latest] }
    defaults: { run: { working-directory: web } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: web/package-lock.json }
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Linux Tauri dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libxdo-dev
      - run: npm ci
      - run: npm run desktop:check
      - run: npm run desktop:test

  package:
    name: Package (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: [web, native]
    strategy:
      fail-fast: false
      matrix: { os: [ubuntu-24.04, windows-latest, macos-latest] }
    defaults: { run: { working-directory: web } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: web/package-lock.json }
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Linux Tauri dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libxdo-dev
      - run: npm ci
      - run: npm run desktop:build
      - name: Upload packaged artifacts
        uses: actions/upload-artifact@v4
        with:
          name: otto-${{ matrix.os }}
          path: web/src-tauri/target/release/bundle/**
          if-no-files-found: error